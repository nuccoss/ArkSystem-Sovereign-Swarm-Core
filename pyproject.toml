[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arksystem-sovereign-swarm-core"
version = "5.0.0"
description = "ArkSystem Sovereign Multi-Agent Swarm Core (SASS v5.0)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-storage>=2.14.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
