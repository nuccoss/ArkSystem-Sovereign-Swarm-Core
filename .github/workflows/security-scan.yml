name: Security & Secret Scan

on: [push, pull_request]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Check for unauthorized secrets
      run: |
        echo "Running deterministic secret & PII leak scan..."
        ! grep -rE "PRIVATE KEY|BEGIN RSA" src/ docs/ examples/
